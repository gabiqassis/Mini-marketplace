server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # fecha antes do grace period do container (evita rebalance longo)
  threads:
    virtual:
      # NAO: no JDK 21 o cliente Kafka faz "pinning" da virtual thread e trava as carriers (ADR-0014).
      # Virtual threads so onde e seguro e util: chamadas de I/O (gateway, Lambda) e o poller do SQS.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace?currentSchema=orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: orders
    default-schema: orders
    locations: classpath:db/messaging,classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms          # Redis lento nao pode travar o servico: falha rapido e segue sem ele
      connect-timeout: 200ms
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:marketplace}
    password: ${RABBIT_PASSWORD:marketplace}
    publisher-confirm-type: simple    # outbox so marca como publicado depois do confirm do broker
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        metadata.max.age.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3

marketplace:
  saga:
    # pedido preso alem destes prazos entra em compensacao (CANCELLING -> libera estoque -> CANCELLED)
    pending-timeout: ${SAGA_PENDING_TIMEOUT:PT2M}
    payment-timeout: ${SAGA_PAYMENT_TIMEOUT:PT5M}
    sweep-interval-ms: 15000
  rate-limit:
    orders-per-minute: ${RATE_LIMIT_ORDERS_PER_MINUTE:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
