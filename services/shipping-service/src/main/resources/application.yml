server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: shipping-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # fecha antes do grace period do container (evita rebalance longo)
  threads:
    virtual:
      # NAO: no JDK 21 o cliente Kafka faz "pinning" da virtual thread e trava as carriers (ADR-0014).
      # Virtual threads so onde e seguro e util: chamadas de I/O (gateway, Lambda) e o poller do SQS.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace?currentSchema=shipping}
    username: ${DB_USER:shipping}
    password: ${DB_PASSWORD:shipping}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: shipping
    default-schema: shipping
    locations: classpath:db/messaging,classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms          # Redis lento nao pode travar o servico: falha rapido e segue sem ele
      connect-timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: shipping-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        metadata.max.age.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3

marketplace:
  carrier:
    webhook-secret: ${CARRIER_WEBHOOK_SECRET:dev-only-carrier-secret-change-me}
    webhook-tolerance: PT5M
  cache:
    tracking-ttl: PT60S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
