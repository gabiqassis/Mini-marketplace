server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # fecha antes do grace period do container (evita rebalance longo)
  threads:
    virtual:
      # NAO: no JDK 21 o cliente Kafka faz "pinning" da virtual thread e trava as carriers (ADR-0014).
      # Virtual threads so onde e seguro e util: chamadas de I/O (gateway, Lambda) e o poller do SQS.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace?currentSchema=payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: payments
    default-schema: payments
    locations: classpath:db/messaging,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        metadata.max.age.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3

marketplace:
  gateway:
    timeout: ${GATEWAY_TIMEOUT:PT1.5S}
    failure-rate: ${GATEWAY_FAILURE_RATE:0}
    slow-response-ms: 3000
    max-concurrent-calls: 20
  reconciliation:
    older-than: PT5S
    interval-ms: 5000
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
