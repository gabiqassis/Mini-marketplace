server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 20s   # fecha antes do grace period do container (evita rebalance longo)
  threads:
    virtual:
      # NAO: no JDK 21 o cliente Kafka faz "pinning" da virtual thread e trava as carriers (ADR-0014).
      # Virtual threads so onde e seguro e util: chamadas de I/O (gateway, Lambda) e o poller do SQS.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace?currentSchema=notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: notification
    default-schema: notification
    locations: classpath:db/messaging,classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms          # Redis lento nao pode travar o servico: falha rapido e segue sem ele
      connect-timeout: 200ms
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:marketplace}
    password: ${RABBIT_PASSWORD:marketplace}
    publisher-confirm-type: simple    # outbox so marca como publicado depois do confirm do broker
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        metadata.max.age.ms: 10000
    listener:
      ack-mode: record
      concurrency: 3

marketplace:
  mail:
    from: nao-responda@minimarketplace.local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
