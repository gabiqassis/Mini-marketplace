# ElasticMQ: servidor com a MESMA API do Amazon SQS (o servico usa o AWS SDK oficial).
# Na AWS: troque o endpoint pelo SQS real; a fila e a DLQ abaixo viram recursos (Terraform/CDK).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"          # a QueueUrl devolvida usa o host da requisicao (funciona de dentro e de fora do Docker)
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # lotes do vendedor. Mensagem nao apagada volta apos 30 s; na 5a falha vai para a DLQ (redrive)
  seller-batches {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "seller-batches-dlq"
      maxReceiveCount = 5
    }
  }
  seller-batches-dlq { }
}
