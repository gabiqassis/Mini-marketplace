# Mini Marketplace - ambiente local completo (perfil A).
#   python scripts/tdd.py all     -> compila, testa, sobe tudo e roda o E2E
#   docker compose up -d --build  -> so sobe (precisa dos jars: python scripts/tdd.py build)
#
# AWS simulada com ferramentas compativeis com a API real (o codigo usa o AWS SDK oficial):
#   SQS    -> ElasticMQ (API SQS)                     endpoint http://elasticmq:9324
#   Lambda -> public.ecr.aws/lambda/java:21 (RIE)     endpoint http://nfe-lambda:8080
# Observabilidade: logs JSON com correlationId; Datadog opcional (docker-compose.datadog.yml).
name: mini-marketplace

x-service: &service
  restart: unless-stopped
  mem_limit: 420m
  depends_on: &infra-ready
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  labels:
    com.datadoghq.ad.logs: '[{"source": "java", "service": "mini-marketplace"}]'

x-env: &common-env
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  RABBIT_HOST: rabbitmq
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash   # 1 linha JSON por log, com correlationId/messageId do MDC

services:
  # ============================== INFRAESTRUTURA ==============================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # 1 schema + 1 usuario por servico
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # topico so existe se estiver no contrato
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro   # filas quorum + retry + parking
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30

  elasticmq:        # "AWS SQS" local
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports: ["9324:9324", "9325:9325"]

  nfe-lambda:       # "AWS Lambda" local (imagem oficial + Runtime Interface Emulator)
    restart: unless-stopped
    build:
      context: ./lambdas/nfe-emitter-lambda
    environment:
      SEFAZ_FAILURE_RATE: "0"
      # vendedor com cadastro irregular na "SEFAZ" (cenario de nota rejeitada nos testes)
      SEFAZ_BLOCKED_CNPJS: "11444777000161"
    ports: ["9001:8080"]

  mailpit:          # SMTP falso com interface web: http://localhost:8025
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  # ================================ SERVICOS ==================================
  ingestion-service:
    <<: *service
    build: {context: ./services/ingestion-service, dockerfile: ../../docker/Dockerfile.service}
    depends_on:
      <<: *infra-ready
      elasticmq:
        condition: service_started
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=ingestion
      AWS_ENDPOINT: http://elasticmq:9324
    ports: ["8086:8086"]

  catalog-service:
    <<: *service
    build: {context: ./services/catalog-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=catalog
    ports: ["8081:8081"]

  inventory-service:
    <<: *service
    build: {context: ./services/inventory-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=inventory
    ports: ["8082:8082"]

  order-service:
    <<: *service
    build: {context: ./services/order-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=orders
      RATE_LIMIT_ORDERS_PER_MINUTE: 30
    ports: ["8080:8080"]

  payment-service:
    <<: *service
    build: {context: ./services/payment-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=payments
      GATEWAY_FAILURE_RATE: "0"
    ports: ["8083:8083"]

  invoice-service:
    <<: *service
    build: {context: ./services/invoice-service, dockerfile: ../../docker/Dockerfile.service}
    depends_on:
      <<: *infra-ready
      nfe-lambda:
        condition: service_started
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=invoicing
      INVOICE_ISSUER: lambda
      NFE_LAMBDA_ENDPOINT: http://nfe-lambda:8080
      NFE_LAMBDA_MAX_CONCURRENT: 1     # o emulador local (RIE) atende 1 invocacao por vez
    ports: ["8084:8084"]

  shipping-service:
    <<: *service
    build: {context: ./services/shipping-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=shipping
      CARRIER_WEBHOOK_SECRET: ${CARRIER_WEBHOOK_SECRET:-dev-only-carrier-secret-change-me}
    ports: ["8085:8085"]

  notification-service:
    <<: *service
    build: {context: ./services/notification-service, dockerfile: ../../docker/Dockerfile.service}
    depends_on:
      <<: *infra-ready
      mailpit:
        condition: service_started
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=notification
      SMTP_HOST: mailpit
    ports: ["8087:8087"]

  audit-service:
    <<: *service
    build: {context: ./services/audit-service, dockerfile: ../../docker/Dockerfile.service}
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/marketplace?currentSchema=audit
    ports: ["8088:8088"]

  # ============================== FERRAMENTAS (opcional) ======================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8090:8080"]

volumes:
  pgdata:
